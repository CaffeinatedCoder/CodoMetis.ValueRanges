# Build and test on every push to main or a release branch, and on every pull request.
# Two lines are supported from 11.0.0 on (CONTRIBUTING.md#branches-and-releases), and each branch
# that ships one needs the same checks as main's:
#
#   - main is the next release. Until the v10.0.0 tag that is 10.0.0; after it, the 11 line, retargeted
#     to .NET 11 right after the tag and shipping 11.0.0-preview.N until 11.0.0.
#   - release/9.x holds 9.x patches until the v10.0.0 tag, then takes no changes.
#   - release/10.x is cut from the v10.0.0 tag and holds the LTS line: 10.x minors (additions for
#     six months after v11.0.0, fixes only after that) and patches, cherry-picked from main.
#
# Pull requests run whatever their base, so a stacked PR (one opened against another open PR's
# branch) is built and tested while it is stacked (#146). Retargeting it to main fires `edited`,
# which is deliberately not a trigger: a body edit would start a run whose skipped jobs pass the
# required checks, and would cancel a real run in the same concurrency group. It isn't needed
# either, because main's protection requires these checks on an up-to-date branch, and a PR whose
# base was merged into main is behind main, so updating it pushes a commit and starts a run.
#
# The release workflow keeps a 10.x tag off GitHub's Latest once 11.0.0 exists, and publishes a
# preview tag as a prerelease (release.yml, "Create the release").
#
# Linux only, deliberately. Nothing in the four shipping packages reads the environment — no
# TimeZoneInfo, no DateTime.Now, no CurrentCulture, no file or path access anywhere in src/ — so
# the library is pure managed code on a single TFM, invariant by contract, and cannot behave
# differently per OS. A second runner would re-test the .NET runtime, not this library.
#
# A Windows job covering the conventions project (the one place that touches Path/Directory/File)
# existed briefly and was removed: it took 92 seconds to run one second of tests, set the critical
# path for the whole workflow, and defended a Windows contributor's ability to run the suite rather
# than anything a consumer receives. That failure would surface on a contributor's first
# `dotnet test` and cost minutes to fix — cheap to discover late. Reinstate it if outside PRs
# become common.
#
# Actions are pinned to commit SHAs, not tags. A tag can be moved to a different commit — that is
# how the tj-actions/changed-files compromise (March 2025) reached every workflow that trusted
# `@v45` — a SHA cannot. The trailing `# vX.Y.Z` is what Dependabot reads to propose an update,
# so keep it next to the SHA (see .github/dependabot.yml).
#
# For information on GitHub Actions with .NET, see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR makes the in-flight run pointless; main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Linux runs the whole suite, because Linux is sufficient to validate the product: nothing in
  # the four shipping packages reads the environment. There is no TimeZoneInfo, no DateTime.Now,
  # no CurrentCulture, no file or path access anywhere in src/ — the library is pure managed code
  # on a single TFM, invariant by contract. It cannot behave differently per OS. The runner's zone
  # is UTC, which skips and repeats no wall clock, so the tests of the local-kind rule set their own
  # (LocalTimeZone, under test/CodoMetis.ValueRanges.Tests) instead of relying on the machine's (#119).
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Everything except the integration projects, which are the next job. test/oracles/ holds
      # the oracle catalogue and seeds, not a project, so folders without a csproj are skipped.
      - name: Unit and convention tests
        run: |
          for project in test/*/; do
            case "$project" in
              *IntegrationTests/) continue ;;
            esac
            ls "$project"*.csproj >/dev/null 2>&1 || continue
            echo "==> $project"
            dotnet test "$project" -c Release --no-build \
              --logger "trx;LogFileName=$(basename "$project")-ubuntu.trx" \
              --results-directory TestResults
          done

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-ubuntu
          path: TestResults/*.trx
          if-no-files-found: ignore

  # One leg per supported PostgreSQL major of the 10.x line: 16, the floor, and 18, the newest
  # (SECURITY.md, #215). VALUERANGES_POSTGRES_IMAGE picks the shared container's image in both
  # projects (PostgresServer.cs); tests that start servers of their own versions are unaffected.
  #
  # And one per EF Core: the floor the EF packages ship against (Npgsql EF 10.0.0, which resolves
  # EF Core 10.0.0), and the newest published 10.0 patch, which is what a consumer's application
  # resolves (#297). The newest-patch legs float only the EF test projects, through the two
  # properties test/Directory.Build.targets reads; src/ still compiles against the floor, as the
  # package a consumer restores was. They also run the EF translation projects, which the test job
  # runs on the floor only. #302 is why: every floor run was green while an empty captured list
  # failed on the server on every EF Core patch from 10.0.2 on.
  #
  # A scheduled run against EF Core's unpublished servicing builds is not here: GitHub fires
  # `schedule` only from the default branch, and the dnceng `dotnet10` feed ends at 10.0.0 (#297).
  integration-legs:
    name: Integration (PostgreSQL ${{ matrix.postgres }}, EF Core ${{ matrix.ef-core || 'floor' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [ 16, 18 ]
        ef: [ floor, newest-patch ]
        include:
          # The newest published EF Core 10 and Npgsql EF 10 patches; a new patch is a bump here and
          # nowhere else. Look them up with
          #   dotnet package search Microsoft.EntityFrameworkCore --exact-match
          #   dotnet package search Npgsql.EntityFrameworkCore.PostgreSQL --exact-match
          # The pair must restore together: Npgsql EF names its minimum EF Core (10.0.1 to 10.0.3
          # need 10.0.4 or newer).
          - ef: newest-patch
            ef-core: 10.0.13
            npgsql-ef: 10.0.3
    env:
      EF_FLOAT: ${{ matrix.ef-core && format('-p:EfFloat={0} -p:NpgsqlEfFloat={1}', matrix.ef-core, matrix.npgsql-ef) || '' }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # EF_FLOAT is empty on the floor legs, and must reach restore and build alike on the others:
      # restore picks the packages, build copies them next to the test assemblies.
      - name: Restore dependencies
        run: dotnet restore $EF_FLOAT

      - name: Build
        run: dotnet build -c Release --no-restore $EF_FLOAT

      # A float that does not reach a test host tests the floor a second time and passes, so a
      # renamed property or project would retire these legs silently. Each EF test host's deps.json
      # must name the versions this leg asked for.
      - name: Check the EF test hosts resolved the newest patch
        if: matrix.ef-core
        env:
          EF_CORE: ${{ matrix.ef-core }}
          NPGSQL_EF: ${{ matrix.npgsql-ef }}
        run: |
          for project in test/*EFCore*/; do
            deps=("$project"bin/Release/*/"$(basename "$project")".deps.json)
            for package in "Microsoft.EntityFrameworkCore/$EF_CORE" "Npgsql.EntityFrameworkCore.PostgreSQL/$NPGSQL_EF"; do
              if ! grep -q "\"$package\"" "${deps[0]}"; then
                echo "::error::${deps[0]} does not resolve $package, so this leg would test the floor."
                exit 1
              fi
            done
            echo "$project resolves EF Core $EF_CORE and Npgsql EF $NPGSQL_EF"
          done

      # CI=true turns an unavailable container into a failure instead of an inconclusive skip.
      # Without it a broken Docker setup would retire the layer that is the authority on
      # PostgreSQL semantics, and the build would still report green.
      #
      # More than one project because some configuration is per process: the InfinityDisabled
      # project runs with an AppContext switch that Npgsql and the plugin read once.
      #
      # Every project runs even after one fails, so a leg reports all of its failures: the step's
      # shell stops at the first failing command, and the glob puts the translation projects last.
      - name: Integration tests
        env:
          CI: true
          VALUERANGES_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: |
          projects=(test/*IntegrationTests/)
          [[ -n "$EF_FLOAT" ]] && projects=(test/*EFCore*/)
          failed=0
          for project in "${projects[@]}"; do
            echo "==> $project"
            dotnet test "$project" -c Release --no-build $EF_FLOAT \
              --logger "trx;LogFileName=$(basename "$project").trx" \
              --results-directory TestResults || failed=1
          done
          exit $failed

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-integration-postgres-${{ matrix.postgres }}-ef-${{ matrix.ef }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  # The required status check: branch protection names "Integration (live PostgreSQL)", and a matrix
  # job reports one check per leg instead, so this job carries the name and passes only when every
  # leg passed — the newest-patch legs as much as the floor ones. `if: always()` makes it report a
  # failure rather than be skipped when a leg fails.
  integration:
    name: Integration (live PostgreSQL)
    runs-on: ubuntu-latest
    needs: [ integration-legs ]
    if: always()

    steps:
      - name: Every PostgreSQL leg passed
        run: test "${{ needs.integration-legs.result }}" = success

  # The only job that exercises the delivery chain rather than the code: NuGet restore against the
  # packed feed, the nuspec dependency chain, the public surface as packaged, and the EF plugins
  # registering from the packaged assemblies. Deliberately independent of the other jobs so it
  # reports in parallel. No database is involved — ToQueryString never connects.
  consumer:
    name: Consumer smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore the packages into a throwaway consumer project
        run: ./test/consumer-smoke-test.sh

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [ test, integration ]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Packing is itself a check: a package that declares PackageReadmeFile without packing the
      # file fails here with NU5019.
      #
      # Build first, then pack --no-build. A bare `dotnet pack` fails with NU5026 because
      # GeneratePackageOnBuild makes pack race the compile.
      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release --no-build -o dist

      # Reads each README back out of the package rather than trusting the property that
      # declared it — the check that caught two packages shipping the root README.
      - name: Verify each package ships its own README
        run: |
          for package in dist/*.nupkg; do
            id="$(basename "$package" .nupkg)"
            heading="$(unzip -p "$package" README.md 2>/dev/null | head -1)"
            if [[ -z "$heading" ]]; then
              echo "::error::$id contains no README.md"
              exit 1
            fi
            printf '%-60s %s\n' "$id" "$heading"
          done

      # The smoke test's *other* invocation mode. The `consumer` job runs it with no argument, where
      # it packs its own feed; here it is handed a pre-built one, exactly as the release workflow
      # does. The two are not interchangeable — packing pre-populates NUGET_PACKAGES with the
      # solution's dependencies, and a restore that only works because of that side effect passes
      # one way and fails the other. That difference broke a release in the sibling repository.
      - name: Consumer smoke test against the packed feed
        run: ./test/consumer-smoke-test.sh dist

      # Generating here too means a broken SBOM step surfaces on a PR rather than on release day.
      #
      # No --exclude-filter: unlike sibling projects, nothing here is referenced with
      # PrivateAssets=all, so every dependency in the graph is one a consumer actually takes on.
      # ReleaseWiringConventionTests asserts that stays true.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          version="$(dotnet msbuild src/CodoMetis.ValueRanges/CodoMetis.ValueRanges.csproj -getProperty:Version)"
          for directory in src/*/; do
            id="$(basename "$directory")"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist --filename "$id.$version.cdx.json" --output-format Json \
              --set-type Library --set-nuget-purl --set-name "$id" --set-version "$version" \
              --include-project-references
          done

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json
