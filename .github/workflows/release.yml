# Publish to NuGet when a v* tag is pushed.
#
# Directory.Build.props is the single source of truth for the version — the tag is checked
# against it rather than driving it, so a mistyped tag fails before anything is pushed. All four
# packages share that one version and release together. The packages themselves are discovered
# from the pack output, so a future satellite package is picked up without editing this file.
#
#   git tag v6.1.0 && git push origin v6.1.0
#
# Publishing uses Trusted Publishing (OIDC): no long-lived API key exists in this repository.
# GitHub signs a short-lived token proving which workflow in which repository is running,
# nuget.org validates it against a policy you configure there, and issues an API key valid for
# one hour. A compromise of this repository's secrets yields nothing that can publish.
#
# Two jobs on purpose: everything that can fail runs unattended, and only the push waits behind
# the environment's approval gate. A reviewer is asked once the full suite has already passed,
# and no OIDC token is minted until they approve.
#
# Three names must agree with the nuget.org policy, or it silently stops matching: this file's
# *name* (release.yml), the environment (`nuget`), and the repository owner/name.
# ReleaseWiringConventionTests pins the first two.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but do not push to NuGet"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read   # deliberately no id-token here: nothing in this job may mint a token

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # MSBuild evaluation rather than parsing the XML, so the value is exactly what the build
      # will stamp onto the packages.
      - name: Resolve version
        id: version
        run: |
          version="$(dotnet msbuild src/CodoMetis.ValueRanges/CodoMetis.ValueRanges.csproj -getProperty:Version)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not evaluate the Version property."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match Directory.Build.props ($version) — bump the version and re-tag rather than publishing a version nothing documents."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # The full suite gates the release, which also means the conventions project runs: a
      # version with no changelog entry at the root or in a package changelog fails here, as
      # does a package that lost its README or its symbols.
      # CI=true keeps the live-PostgreSQL layer mandatory.
      - name: Test
        env:
          CI: true
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o dist

      # No --exclude-filter: nothing in this repository is referenced with PrivateAssets=all, so
      # every dependency in the graph is one a consumer actually takes on and the SBOM matches
      # the nuspec. ReleaseWiringConventionTests fails if that stops being true.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          for directory in src/*/; do
            id="$(basename "$directory")"
            echo "==> $id"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist \
              --filename "$id.${{ steps.version.outputs.version }}.cdx.json" \
              --output-format Json \
              --set-type Library \
              --set-nuget-purl \
              --set-name "$id" \
              --set-version "${{ steps.version.outputs.version }}" \
              --include-project-references
          done

      - name: Collect packages
        run: |
          shopt -s nullglob
          packages=(dist/*."${{ steps.version.outputs.version }}".nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No *.${{ steps.version.outputs.version }}.nupkg found in dist/."
            exit 1
          fi
          printf 'Packages (%d):\n' "${#packages[@]}"
          printf '    %s\n' "${packages[@]##*/}"

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify

    # Skipped entirely on a dry run, so no approval is requested and no token is minted.
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}

    # The approval gate. Must match the environment named in the nuget.org policy.
    environment: nuget

    permissions:
      contents: read
      id-token: write   # lets GitHub mint the OIDC token nuget.org validates

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Publishes exactly what was verified — the packages are not rebuilt here.
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Verify the publisher identity is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER secret is not set — it must be your nuget.org profile name, not the email address."
            exit 1
          fi

      # Exchanges this run's OIDC token for an API key that nuget.org issues against the trusted
      # publishing policy, valid for one hour. The token is single-use and nothing is stored.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only .nupkg is globbed — dotnet nuget push uploads the matching .snupkg alongside it
      # automatically, so symbols need no separate step.
      #
      # --skip-duplicate makes a re-run after a partial failure safe: already-published packages
      # are reported and skipped instead of failing the job. The temporary key expires an hour
      # after login, so a much-delayed re-run needs a fresh workflow run.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
            echo "==> Pushing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Summary
        run: |
          {
            echo "### Released ${{ needs.verify.outputs.version }}"
            echo
            for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
              echo "- \`$(basename "$package")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
