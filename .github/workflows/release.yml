# Publish to NuGet when a v* tag is pushed.
#
# Directory.Build.props is the single source of truth for the version — the tag is checked
# against it rather than driving it, so a mistyped tag fails before anything is pushed. All four
# packages share that one version and release together. The packages themselves are discovered
# from the pack output, so a future satellite package is picked up without editing this file.
#
#   git tag v6.1.0 && git push origin v6.1.0
#
# Publishing uses Trusted Publishing (OIDC): no long-lived API key exists in this repository.
# GitHub signs a short-lived token proving which workflow in which repository is running,
# nuget.org validates it against a policy you configure there, and issues an API key valid for
# one hour. A compromise of this repository's secrets yields nothing that can publish.
#
# Three jobs on purpose: everything that can fail runs unattended, only the push waits behind
# the environment's approval gate, and the GitHub release is created afterwards. A reviewer is
# asked once the full suite has already passed, and no OIDC token is minted until they approve.
# The job that can mint a token cannot write to the repository, and the job that can write to
# the repository cannot mint a token.
#
# Actions are pinned to commit SHAs, not tags — this is the publish path, and NuGet/login runs in
# the one job that can mint a token. A moved tag reaches every workflow trusting it; a SHA does
# not. The trailing `# vX.Y.Z` is what Dependabot reads to propose an update; keep it by the SHA.
#
# Three names must agree with the nuget.org policy, or it silently stops matching: this file's
# *name* (release.yml), the environment (`nuget`), and the repository owner/name.
# ReleaseWiringConventionTests pins the first two.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but do not push to NuGet"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read   # deliberately no id-token here: nothing in this job may mint a token

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      # MSBuild evaluation rather than parsing the XML, so the value is exactly what the build
      # will stamp onto the packages.
      - name: Resolve version
        id: version
        run: |
          version="$(dotnet msbuild src/CodoMetis.ValueRanges/CodoMetis.ValueRanges.csproj -getProperty:Version)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not evaluate the Version property."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match Directory.Build.props ($version) — bump the version and re-tag rather than publishing a version nothing documents."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # The full suite gates the release, which also means the conventions project runs: a
      # version with no changelog entry at the root or in a package changelog fails here, as
      # does a package that lost its README or its symbols.
      # CI=true keeps the live-PostgreSQL layer mandatory.
      - name: Test
        env:
          CI: true
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o dist

      # No --exclude-filter: nothing in this repository is referenced with PrivateAssets=all, so
      # every dependency in the graph is one a consumer actually takes on and the SBOM matches
      # the nuspec. ReleaseWiringConventionTests fails if that stops being true.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          for directory in src/*/; do
            id="$(basename "$directory")"
            echo "==> $id"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist \
              --filename "$id.${{ steps.version.outputs.version }}.cdx.json" \
              --output-format Json \
              --set-type Library \
              --set-nuget-purl \
              --set-name "$id" \
              --set-version "${{ steps.version.outputs.version }}" \
              --include-project-references
          done

      - name: Collect packages
        run: |
          shopt -s nullglob
          packages=(dist/*."${{ steps.version.outputs.version }}".nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No *.${{ steps.version.outputs.version }}.nupkg found in dist/."
            exit 1
          fi
          printf 'Packages (%d):\n' "${#packages[@]}"
          printf '    %s\n' "${packages[@]##*/}"

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify

    # Skipped entirely on a dry run, so no approval is requested and no token is minted.
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}

    # The approval gate. Must match the environment named in the nuget.org policy.
    environment: nuget

    permissions:
      contents: read
      id-token: write   # lets GitHub mint the OIDC token nuget.org validates

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      # Publishes exactly what was verified — the packages are not rebuilt here.
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Verify the publisher identity is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER secret is not set — it must be your nuget.org profile name, not the email address."
            exit 1
          fi

      # Exchanges this run's OIDC token for an API key that nuget.org issues against the trusted
      # publishing policy, valid for one hour. The token is single-use and nothing is stored.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only .nupkg is globbed — dotnet nuget push uploads the matching .snupkg alongside it
      # automatically, so symbols need no separate step.
      #
      # --skip-duplicate makes a re-run after a partial failure safe: already-published packages
      # are reported and skipped instead of failing the job. The temporary key expires an hour
      # after login, so a much-delayed re-run needs a fresh workflow run.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
            echo "==> Pushing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Summary
        run: |
          {
            echo "### Released ${{ needs.verify.outputs.version }}"
            echo
            for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
              echo "- \`$(basename "$package")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Gives the SBOMs a permanent home. Workflow artifacts expire after 90 days and nuget.org has no
  # slot for an SBOM, so without this job the "each release ships an SBOM" statement in SECURITY.md
  # holds for one quarter. Runs after the push, so what is attached describes what is on nuget.org.
  #
  # Only the SBOMs are attached, deliberately. nuget.org repository-signs every package on
  # ingestion, so a .nupkg downloaded from there differs byte-for-byte from the one built here;
  # attaching ours would invite a hash comparison that fails for a benign reason. nuget.org is the
  # immutable store for the packages; the SBOM has no other home.
  #
  # The release itself is created here when it does not exist yet, with this version's section of
  # CHANGELOG.md as the notes — the same section ChangelogConventionTests already requires for the
  # shipped version, so an empty extraction is a workflow bug and fails the job rather than
  # publishing a blank release. A release created by hand before the tag was pushed is left as
  # written; only the assets are added. Either way the packages are already on nuget.org: a
  # failure here is loud and costs nothing but a manual upload.
  #
  # Separate from `publish` on purpose: that job holds id-token: write, this one holds
  # contents: write, and no job holds both.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [ verify, publish ]

    # Tag pushes only. A manual non-dry run from a branch has no tag to release against.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # create the release and upload assets; deliberately no id-token

    steps:
      # The checkout is for CHANGELOG.md, the source of the release notes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="$GITHUB_REF_NAME"

          # "Not found" is the one failure that means "create it"; anything else (auth, API) must
          # not be mistaken for it, or a release that exists gets a second create attempt.
          if gh release view "$tag" --json tagName >/dev/null 2>view.err; then
            echo "Release $tag already exists; leaving its notes as written."
            exit 0
          elif ! grep -q "release not found" view.err; then
            cat view.err
            echo "::error::Could not determine whether release $tag exists."
            exit 1
          fi

          # The section for this version: from its `## [x.y.z] — date` heading up to, not
          # including, the next H2. The heading's brackets are a reference-style link whose
          # target is this very release page, so they are dropped rather than left to render as
          # literal brackets.
          notes="$(awk -v version="$VERSION" '
            BEGIN { heading = "^## \\[" version "\\]" }
            $0 ~ heading { found = 1; sub(/^## \[[^]]*\]/, "## " version); print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"

          if [[ -z "$notes" ]]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section to use as release notes."
            exit 1
          fi

          {
            printf '%s\n\n' "$notes"
            printf 'Published to nuget.org through Trusted Publishing by [this run](%s). ' "$RUN_URL"
            printf 'The CycloneDX SBOM for each package is attached below.\n'
          } > release-notes.md

          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md "${flags[@]}"

      - name: Attach the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          shopt -s nullglob
          sboms=(dist/*."$VERSION".cdx.json)
          if [[ ${#sboms[@]} -eq 0 ]]; then
            echo "::error::No *.$VERSION.cdx.json in the downloaded artifact — the SBOM step in verify did not run, or the artifact glob changed."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${sboms[@]}" --clobber
