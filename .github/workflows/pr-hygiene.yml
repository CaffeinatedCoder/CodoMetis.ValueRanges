# Every PR carries one type label, a severity if it is a bug, and a closing reference to the issue
# it resolves (CONTRIBUTING.md#issues). The rules live in .github/scripts/pr-hygiene.sh, which reads
# only the event payload: no token, no checkout of the PR's code, and runnable locally.
#
# Triggered on label and description edits as well as pushes, so adding the missing label turns the
# check green without a new commit. `pull_request`, not `pull_request_target`: a PR from a fork runs
# with a read-only token and never sees a secret.

name: PR hygiene

on:
  pull_request:
    branches: [ "main", "release/**" ]
    types: [ opened, edited, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Labels and issue link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/pr-hygiene.sh "$GITHUB_EVENT_PATH"
