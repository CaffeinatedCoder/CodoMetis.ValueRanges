# Every PR carries one type label, a severity if it is a bug, and a closing reference to the issue
# it resolves (CONTRIBUTING.md#issues); a `silent` PR into a minor also carries its issue's row
# under "### Changed answers" in CHANGELOG.md (CONTRIBUTING.md#branches-and-releases). The rules
# live in .github/scripts/pr-hygiene.sh, which reads the event payload and two text files of the
# checkout, CHANGELOG.md and Directory.Build.props: no token, nothing of the PR's executed, and
# runnable locally. The sparse checkout is in cone mode, which always includes the root's files.
#
# Triggered on label and description edits as well as pushes, so adding the missing label turns the
# check green without a new commit. `pull_request`, not `pull_request_target`: a PR from a fork runs
# with a read-only token and never sees a secret.
#
# One run per event, and none is cancelled (#526). A PR pushed and then labelled and described within
# seconds starts several runs, and GitHub counts every one of them in the commit's status: a cancelled
# run, or a failed run for a payload that had no labels yet, turns it red beside a later green run.
# With a concurrency group and `cancel-in-progress: true`, 61 of the last 100 merged PRs showed a
# failing status for nothing but cancelled runs of this check. Without a group, the runs overlap and
# finish in any order. So each run first waits for the burst to settle, then compares its payload with
# the PR as it is now. If the head, the base, the labels or the description changed since, the event
# that changed them started a newer run, which decides; this one passes without checking. Only those
# four fields are compared, because a change to any of them is itself a trigger (`synchronize`,
# `edited`, `labeled`, `unlabeled`): a newer run is certain to exist. Measured on #527.

name: PR hygiene

on:
  pull_request:
    branches: [ "main", "release/**" ]
    types: [ opened, edited, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Labels and issue link
    runs-on: ubuntu-latest
    steps:
      - name: Skip a superseded payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          PULL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          # Measurement only (#526): hold back a payload without labels, so it finishes last.
          if [ "$(jq '.pull_request.labels | length' "$GITHUB_EVENT_PATH")" = 0 ]; then sleep 60; fi
          sleep 20
          fields='[.head.sha, .base.ref, (.body // ""), ([.labels[].name] | sort)]'
          live=$(gh api "$PULL" | jq -c "$fields")
          sent=$(jq -c ".pull_request | $fields" "$GITHUB_EVENT_PATH")
          if [[ $live == "$sent" ]]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "The PR changed after this event, so the run for the newer event decides." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.payload.outputs.superseded == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
      - if: steps.payload.outputs.superseded == 'false'
        run: .github/scripts/pr-hygiene.sh "$GITHUB_EVENT_PATH"
