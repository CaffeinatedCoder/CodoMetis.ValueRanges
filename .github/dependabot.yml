# Two ecosystems, on purpose narrow.
#
# github-actions keeps the SHA-pinned actions in the workflows current — a pin without an update
# path just ages. Weekly, one grouped PR, so a security release in an action is not waiting a month.
# Majors are excluded: this is the publish path, and release.yml documents why upload-artifact
# stays on v6 and download-artifact on v7 (v8 stops auto-unzipping, which would break the push
# step). A major is a deliberate change with a test behind it, not a Monday PR.
#
# nuget covers the test projects only. The shipping projects under src/ are deliberately excluded:
# their EF Core provider and NodaTime references are the floors consumers restore against —
# raising one raises every consumer's minimum, which is a release decision, not a dependency
# update. The test projects' EF Core and Npgsql references track those floors for the same reason
# and are ignored here; bump them by hand together with the floor. Security advisories still
# surface for everything as Dependabot alerts and through NuGetAudit at build time. Security
# update PRs honour the ignore list below, which is how the toolchain packages at its end stay
# out of the csproj.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: nuget
    directories:
      - /test/*
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Npgsql*"
      # The test projects reach NodaTime only through their reference to the shipping satellite,
      # so an update here is an edit to src/: 9.0.0 nearly shipped a raised floor that way.
      - dependency-name: "NodaTime"
      # The ASP.NET Core packages version with the shared framework: 11.x needs net11.0.
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: [ "version-update:semver-major" ]
      # Reached only through the Microsoft.EntityFrameworkCore.Design reference of two test projects
      # (-> Microsoft.Build.Tasks.Core, Microsoft.CodeAnalysis.Workspaces.MSBuild): the EF Core tests,
      # for MigrationScaffoldTests, and the integration tests, for CompiledModelJsonTests (#43).
      # Neither scaffolding nor compiled-model generation signs or verifies XML or parses PKCS data,
      # and no shipping project references Design, so consumers never receive either package. Dependabot's
      # remedy is a direct pin of a toolchain internal in the test csproj (#160, #161), and every new
      # advisory brings another one. The alerts are dismissed as not used (#194); NU1903 stays a
      # warning (Directory.Build.props), so a new advisory still shows up at build time.
      - dependency-name: "System.Security.Cryptography.Xml"
      - dependency-name: "System.Security.Cryptography.Pkcs"
